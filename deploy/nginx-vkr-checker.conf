# nginx reverse-proxy для vkr-checker (вкр-чекер.рф / xn----ctbkawc3be3d.xn--p1ai)
# Целевой путь на сервере: /etc/nginx/sites-available/vkr-checker
# (симлинк в /etc/nginx/sites-enabled/vkr-checker)
#
# Ключевое: отдельный location /api/course/ с увеличенным таймаутом — тяжёлые
# проверки (GPT + парсинг файлов) на RAM-ограниченном боксе идут долго, и без
# этого nginx рубил их в 504 (HTML), из-за чего фронт падал на JSON.parse.

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name xn----ctbkawc3be3d.xn--p1ai www.xn----ctbkawc3be3d.xn--p1ai вкр-чекер.рф www.вкр-чекер.рф;
    return 301 https://$host$request_uri;
}

# HTTPS main server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn----ctbkawc3be3d.xn--p1ai www.xn----ctbkawc3be3d.xn--p1ai вкр-чекер.рф www.вкр-чекер.рф;

    ssl_certificate /etc/letsencrypt/live/xn----ctbkawc3be3d.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn----ctbkawc3be3d.xn--p1ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    # Тяжёлые проверки (GPT + парсинг файлов) могут идти долго на swap-bound боксе —
    # даём 300s, чтобы вернуть JSON, а не рубить в 504-HTML.
    location /api/course/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
