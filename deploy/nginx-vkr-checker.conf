# nginx reverse-proxy для vkr-checker (вкр-чекер.рф = xn----ctbkawc3be3d.xn--p1ai)
# Копия рабочего конфига с прод-сервера (ВМ vkr-checker, Yandex Cloud), снята 04.10.2026.
# На сервере: /etc/nginx/sites-available/vkr-checker (симлинк в sites-enabled).
#
# Строки «managed by Certbot» дописал certbot при выпуске сертификата Let's Encrypt.
# На новом сервере ставьте этот файл БЕЗ них (только оба блока location и
# client_max_body_size), затем запустите `sudo certbot --nginx -d <домен> -d www.<домен>` —
# certbot сам добавит listen 443, пути к сертификату и редирект с http. См. docs/RESTORE.md.
#
# Отдельный location /api/course/ с таймаутом 300 с: проверка курсовой (модель + разбор
# файла + чтение Яндекс.Диска) идёт долго, и без этого nginx отдавал 504 в виде HTML,
# а фронт падал на JSON.parse.

server {
    server_name xn----ctbkawc3be3d.xn--p1ai www.xn----ctbkawc3be3d.xn--p1ai;
    client_max_body_size 50m;

    location /api/course/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50m;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/xn----ctbkawc3be3d.xn--p1ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/xn----ctbkawc3be3d.xn--p1ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.xn----ctbkawc3be3d.xn--p1ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = xn----ctbkawc3be3d.xn--p1ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name xn----ctbkawc3be3d.xn--p1ai www.xn----ctbkawc3be3d.xn--p1ai;
    return 404; # managed by Certbot
}
